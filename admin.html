<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helping Hands - Analytics</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #17213a; background: #f4f6fa; }
    body { margin: 0; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
    h1 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .card { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 4px 20px rgba(7,23,57,.06); }
    .card strong { display: block; font-size: 28px; margin-top: 8px; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border-bottom: 1px solid #e7eaf0; text-align: left; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 18px; }
    input, button { height: 40px; border-radius: 8px; border: 1px solid #dfe3ea; padding: 0 12px; }
    button { background: #071739; color: white; cursor: pointer; }
    @media (max-width: 700px) { .grid, .panels { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Helping Hands Analytics</h1>
    <div class="toolbar">
      <input id="key" type="password" placeholder="Cheie dashboard">
      <button id="load">Încarcă</button>
      <button id="export">Exportă CSV</button>
    </div>
    <div class="grid">
      <div class="card">Lead-uri<strong id="leads">-</strong></div>
      <div class="card">Sesiuni<strong id="sessions">-</strong></div>
      <div class="card">Vizualizări<strong id="views">-</strong></div>
      <div class="card">Submit-uri<strong id="submissions">-</strong></div>
    </div>
    <div class="panels">
      <section class="card"><h2>Click-uri</h2><div id="clicks"></div></section>
      <section class="card"><h2>Scroll maxim mediu</h2><strong id="scroll">-</strong></section>
      <section class="card"><h2>Ultimele emailuri</h2><table><thead><tr><th>Email</th><th>Data</th></tr></thead><tbody id="leadsTable"></tbody></table></section>
      <section class="card"><h2>Evenimente recente</h2><table><thead><tr><th>Tip</th><th>Detalii</th></tr></thead><tbody id="events"></tbody></table></section>
    </div>
  </main>
  <script>
    var keyInput = document.getElementById("key");
    keyInput.value = sessionStorage.getItem("hh_admin_key") || "";

    function escapeHtml(value) {
      var element = document.createElement("span");
      element.textContent = value == null ? "" : String(value);
      return element.innerHTML;
    }

    async function load() {
      var key = keyInput.value;
      sessionStorage.setItem("hh_admin_key", key);
      var response = await fetch("/api/admin/stats?key=" + encodeURIComponent(key));
      if (!response.ok) throw new Error("Cheie invalidă.");
      var data = await response.json();
      document.getElementById("leads").textContent = data.leadCount;
      document.getElementById("sessions").textContent = data.sessionCount;
      document.getElementById("views").textContent = data.pageViews;
      document.getElementById("submissions").textContent = data.submissions;
      document.getElementById("clicks").innerHTML = data.topClicks.map(function (row) {
        return "<div>" + escapeHtml(row.label || "(fără text)") + ": <strong>" + row.count + "</strong></div>";
      }).join("");
      var scrollValues = data.scrollDepth.map(function (row) { return row.percent || 0; });
      var average = scrollValues.length ? Math.round(scrollValues.reduce(function (sum, value) { return sum + value; }, 0) / scrollValues.length) : 0;
      document.getElementById("scroll").textContent = average + "%";
      document.getElementById("leadsTable").innerHTML = data.recentLeads.map(function (row) {
        return "<tr><td>" + escapeHtml(row.email) + "</td><td>" + escapeHtml(row.created_at) + "</td></tr>";
      }).join("");
      document.getElementById("events").innerHTML = data.recentEvents.map(function (row) {
        return "<tr><td>" + escapeHtml(row.type) + "</td><td>" + escapeHtml(row.data) + "</td></tr>";
      }).join("");
    }

    document.getElementById("load").addEventListener("click", function () {
      load().catch(function (error) { alert(error.message); });
    });
    document.getElementById("export").addEventListener("click", function () {
      var key = encodeURIComponent(keyInput.value);
      window.location.href = "/api/admin/leads.csv?key=" + key;
    });
  </script>
</body>
</html>
